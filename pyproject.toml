[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deribit-price-api"
version = "1.0.0"
description = "Periodic Deribit index price collector and read API"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "celery[redis]>=5.3,<6",
  "fastapi>=0.110,<1",
  "psycopg[binary]>=3.1,<4",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
